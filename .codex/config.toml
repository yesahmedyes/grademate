[mcp_servers.langfuse-docs]
url = "https://langfuse.com/api/mcp"

[mcp_servers.magicui]
command = "npx"
args = [
    "-y",
    "@magicuidesign/mcp@latest",
]

[mcp_servers.next-devtools]
command = "npx"
args = [
    "-y",
    "next-devtools-mcp@latest",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.shadcn]
command = "npx"
args = [
    "-y",
    "shadcn@latest",
    "mcp",
]
